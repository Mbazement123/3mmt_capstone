version: "3.9"
services:
  mario-api:
    image: mbazement123/mario-api:latest
    build:
      context: ./mario-api
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://pgadmin:mario_local_pass@postgres:5432/mario}
      - DB_SSL=${DB_SSL:-false}

  postgres:
    image: postgres:11-alpine
    environment:
      - POSTGRES_USER=pgadmin
      - POSTGRES_PASSWORD=mario_local_pass
      - POSTGRES_DB=mario
    volumes:
      - postgres-data:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus:/etc/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

  pushgateway:
    image: prom/pushgateway:latest
    ports:
      - "9091:9091"

volumes:
  postgres-data:
