apiVersion: apps/v1
kind: Deployment
metadata:
  name: mario-api
  labels:
    app: mario-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mario-api
  template:
    metadata:
      labels:
        app: mario-api
    spec:
      containers:
        - name: mario-api
          image: mbazement123/mario-api:latest
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mario-db
                  key: database_url
            - name: DB_SSL
              value: "true"
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /api
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
