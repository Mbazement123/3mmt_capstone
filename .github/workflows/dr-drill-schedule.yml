name: Scheduled DR Drill

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  dr-drill:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Kind cluster
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: dr-drill-cluster

      - name: Install LitmusChaos CRDs
        run: |
          kubectl apply -f https://litmuschaos.github.io/litmus/litmus-operator-v1.13.0.yaml
          kubectl wait --for=condition=Available deployment/litmus-operator -n litmus --timeout=120s || true

      - name: Execute DR drill
        env:
          DR_ENC_KEY: ${{ secrets.DR_ENC_KEY }}
        run: |
          chmod +x ./scripts/*.sh
          ./scripts/backup.sh
          ./scripts/restore.sh dr-site
          kubectl port-forward svc/mario-api-service 8080:80 -n dr-site &
          PF_PID=$!
          sleep 5
          ./scripts/health-check.sh http://localhost:8080
          kill $PF_PID || true
