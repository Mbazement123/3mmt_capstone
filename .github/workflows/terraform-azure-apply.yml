name: "Terraform: Azure Postgres Provision"

on:
  workflow_dispatch:
    inputs:
      allowed_ip:
        description: 'IP or CIDR to allow to access the DB (default 0.0.0.0)'
        required: false
        default: '0.0.0.0'
      location:
        description: 'Azure region to create resources in'
        required: false
        default: 'centralus'
      create_github_secret:
        description: 'If true and PERSONAL_GITHUB_PAT is provided, create repository secret DATABASE_URL'
        required: false
        default: 'false'

jobs:
  terraform-apply:
    name: Apply Terraform (Azure)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }} # 3d67a7d5-9315-4d5f-b111-5020efc461b7
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }} # d05a899e-0b13-4d1f-ba87-ac19e2bad1ef
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }} #0adde2d7-a128-464a-b72f-008ec63881f3
      PERSONAL_GITHUB_PAT: ${{ secrets.PERSONAL_GITHUB_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.5.0'

      - name: Azure Login (using AZURE_CREDENTIALS JSON)
        if: ${{ env.AZURE_CREDENTIALS != '' }}
        uses: azure/login@v1
        with:
          creds: ${{ env.AZURE_CREDENTIALS }}

      - name: Azure Login (using ARM_* secrets)
        if: ${{ env.AZURE_CREDENTIALS == '' }}
        uses: azure/login@v1
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          client-secret: ${{ env.ARM_CLIENT_SECRET }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: infra/azure
        run: terraform init -input=false

      - name: Terraform Apply
        working-directory: infra/azure
        env:
          TF_IN_AUTOMATION: true
        run: |
          terraform apply -auto-approve -input=false \
            -var="allowed_ip=${{ github.event.inputs.allowed_ip }}" \
            -var="location=${{ github.event.inputs.location }}"

      - name: Capture DB URL
        id: tf_output
        working-directory: infra/azure
        run: |
          dburl=$(terraform output -raw database_url)
          echo "dburl=$dburl" >> $GITHUB_OUTPUT

      - name: Save database_url artifact
        uses: actions/upload-artifact@v4
        with:
          name: database_url
          path: infra/azure/database_url.txt
        continue-on-error: true

      - name: Write database_url file
        if: always()
        working-directory: infra/azure
        run: echo "${{ steps.tf_output.outputs.dburl }}" > database_url.txt

      - name: Optionally create repository secret DATABASE_URL
        if: ${{ env.PERSONAL_GITHUB_PAT != '' && github.event.inputs.create_github_secret == 'true' }}
        uses: actions/github-script@v6
        with:
          packages: |
            tweetsodium
          script: |
            const sodium = require('tweetsodium');
            const secretName = 'DATABASE_URL';
            const secretValue = process.env.TF_DBURL || `${{ steps.tf_output.outputs.dburl }}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Get the public key for repository secrets
            const pk = await github.request('GET /repos/{owner}/{repo}/actions/secrets/public-key', {
              owner,
              repo,
              headers: { authorization: `token ${process.env.PAT}` }
            });

            const publicKey = pk.data.key;
            const keyId = pk.data.key_id;

            // Encrypt the secret using the repository public key
            const messageBytes = Buffer.from(secretValue);
            const keyBytes = Buffer.from(publicKey, 'base64');
            const encryptedBytes = sodium.seal(messageBytes, keyBytes);
            const encrypted = Buffer.from(encryptedBytes).toString('base64');

            // Create or update the secret via REST API
            await github.request('PUT /repos/{owner}/{repo}/actions/secrets/{secret_name}', {
              owner,
              repo,
              secret_name: secretName,
              encrypted_value: encrypted,
              key_id: keyId,
              headers: { authorization: `token ${process.env.PAT}` }
            });
        env:
          TF_DBURL: ${{ steps.tf_output.outputs.dburl }}
          PAT: ${{ env.PERSONAL_GITHUB_PAT }}

      - name: Output summary
        run: |
          echo "Database URL written to infra/azure/database_url.txt"
          echo "(secret creation attempted if requested)"
